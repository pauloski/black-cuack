  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Blackcuack Studio</title>
  <link rel="manifest" href="manifest.json">

  <!-- FFmpeg.wasm bridge — loaded on demand when user exports MP4 -->
  <script>
    (function () {
      var _inst = null;

      window._ffmpegLoad = async function () {
        if (_inst) return;
        if (!window.FFmpeg) {
          await new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        _inst = window.FFmpeg.createFFmpeg({
          corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
          log: false,
        });
        await _inst.load();
      };

      window._ffmpegWriteFile = function (name, data) {
        _inst.FS('writeFile', name, data);
      };

      window._ffmpegRun = async function (cmd) {
        var args = cmd.trim().split(/\s+/);
        await _inst.run.apply(_inst, args);
      };

      window._ffmpegReadFile = function (name) {
        return _inst.FS('readFile', name);
      };

      window._ffmpegUnlink = function (name) {
        try { _inst.FS('unlink', name); } catch (e) { }
      };
    })();
  </script>
</head>
<body>
  <script>
    // ✅ Hemos eliminado {{footer_script}} para evitar errores de ReferenceError
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html" // 🦆 FUERZA EL RENDERIZADOR PARA VER LAS FOTOS
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
