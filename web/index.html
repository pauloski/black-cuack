<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BlackQuack Studio - Taller de animación cuadro a cuadro">

  <!-- Demo privada: evitar que los buscadores la indexen -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BlackQuack Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SVG favicon (Chrome, Firefox, Edge) with PNG fallback (Safari) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BlackQuack Studio</title>
  <link rel="manifest" href="manifest.json">

  <!-- FFmpeg.wasm bridge — loaded on demand when user exports MP4 -->
  <script>
    (function () {
      var _inst = null;

      window._ffmpegLoad = async function () {
        if (_inst) return;
        if (!window.FFmpeg) {
          await new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        _inst = window.FFmpeg.createFFmpeg({
          corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
          log: false,
        });
        await _inst.load();
      };

      window._ffmpegWriteFile = function (name, data) {
        _inst.FS('writeFile', name, data);
      };

      window._ffmpegRun = async function (cmd) {
        var args = cmd.trim().split(/\s+/);
        await _inst.run.apply(_inst, args);
      };

      window._ffmpegReadFile = function (name) {
        return _inst.FS('readFile', name);
      };

      window._ffmpegUnlink = function (name) {
        try { _inst.FS('unlink', name); } catch (e) { }
      };
    })();
  </script>

  <!--
    Arranque estándar de Flutter. En el deploy, scripts/deploy_demo.sh reemplaza
    el service worker por un "kill-switch" (borra cachés y se da de baja, sin
    interceptar la red) y _headers sirve el punto de entrada sin caché. Así una
    demo que se redespliega seguido trae siempre el build más reciente sin recargar.
    (El modo sin conexión del MVP vive en la app Android; la web es solo para demos.)
  -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
